<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Latina — Abrir emisora</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f3ef; color: #171916; text-align: center; padding: 24px; }
  .card { background: #fff; border-radius: 20px; padding: 36px 28px; box-shadow: 0 12px 40px rgba(0,0,0,.1); max-width: 380px; }
  h1 { font-size: 1.3rem; margin: 0 0 .6rem; }
  p { color: #666; font-size: .95rem; }
  a.btn { display: inline-block; margin-top: 18px; background: #d34228; color: #fff; text-decoration: none; font-weight: 700; padding: 14px 28px; border-radius: 999px; }
  a.btn:active { transform: scale(.97); }
  .logo { width: 88px; height: 88px; border-radius: 24px; display: block; margin: 0 auto 14px; box-shadow: 0 8px 22px rgba(0,0,0,.2); }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="logo" src="/logo.jpg" alt="Radio Latina">
  <h1>Radio Latina</h1>
  <p id="msg">Te invitaron a escuchar una emisora en Radio Latina.</p>
  <a class="btn" id="open" href="#">Abrir en Radio Latina</a>
  <p style="margin-top:16px;font-size:.8rem">¿No tienes la app? Búscala como <b>Radio Latina – Radio en vivo</b> en Google Play.</p>
</div>
<script>
  // GitHub Pages sirve este 404.html para /e/<slug> (no existe archivo por slug).
  // Si la ruta es de una emisora compartida, mostramos la invitación;
  // si no, un 404 genérico de Radio Latina.
  var parts = location.pathname.split("/").filter(Boolean);
  var msg = document.getElementById("msg");
  var openBtn = document.getElementById("open");
  if (parts.length >= 2 && parts[0] === "e" && parts[1]) {
    var slug = parts[1];
    var pretty = slug.replace(/-/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    msg.textContent = "Te invitaron a escuchar " + pretty + " en Radio Latina.";
    openBtn.href = location.href; // https: la app la intercepta si está instalada
  } else {
    msg.textContent = "La página que buscas no existe.";
    openBtn.style.display = "none";
  }
</script>
</body>
</html>
